<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="The Pellow and Finch parcel depot: a warehouse with loading bays, two delivery vans and stacked parcels">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f2"/><stop offset="1" stop-color="#eaf4f9"/></linearGradient>
  <pattern id="ribs" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#e6eaf0"/><rect width="2" height="10" fill="#d3d9e2"/></pattern>
  <pattern id="door" width="10" height="9" patternUnits="userSpaceOnUse"><rect width="10" height="9" fill="#a7b2c0"/><rect y="7" width="10" height="2" fill="#8e9aab"/></pattern>
  <g id="finch"><path d="M0 10 C4 0 18 -2 26 6 L36 4 L29 10 C27 18 16 22 6 18 L-4 22 L2 14 Z" fill="#e2733a"/><circle cx="22" cy="7" r="2" fill="#20232a"/><path d="M8 11 C14 8 20 10 22 14 C16 16 10 15 8 11 Z" fill="#f4a261"/></g>
  <g id="box"><rect width="34" height="28" rx="2" fill="#c8955c"/><rect x="14" width="6" height="28" fill="#e9c98f"/><rect y="0" width="34" height="5" fill="#b07f4b"/></g>
  <g id="van">
    <path d="M0 40 L0 104 L226 104 L226 66 C226 56 220 50 210 48 L178 18 C174 14 168 12 162 12 L150 12 L150 0 L8 0 C3 0 0 4 0 9 Z" fill="#f7f8fa"/>
    <path d="M156 20 L186 50 L156 50 Z" fill="#9fc6dd"/><rect x="0" y="62" width="226" height="10" fill="#e2733a"/>
    <use href="#finch" transform="translate(28 22) scale(1.1)"/><text x="68" y="44" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#2b3442">PELLOW &amp; FINCH</text>
    <rect x="214" y="78" width="12" height="8" rx="2" fill="#f2c94c"/>
    <circle cx="48" cy="106" r="17" fill="#252a33"/><circle cx="48" cy="106" r="7" fill="#9aa5b4"/><circle cx="180" cy="106" r="17" fill="#252a33"/><circle cx="180" cy="106" r="7" fill="#9aa5b4"/>
  </g>
</defs>
<rect width="1200" height="340" fill="url(#sky)"/>
<circle cx="1050" cy="70" r="42" fill="#fff6d8"/>
<path d="M0 230 C160 190 300 205 430 214 C600 226 760 186 920 196 C1040 204 1120 214 1200 206 L1200 260 L0 260 Z" fill="#b9d3c2"/>
<rect y="248" width="1200" height="92" fill="#5d6876"/>
<path d="M0 300 H1200" stroke="#f4f6f8" stroke-width="3" stroke-dasharray="36 28"/>
<!-- the depot -->
<rect x="120" y="96" width="640" height="160" fill="url(#ribs)"/>
<path d="M104 100 L440 62 L776 100 Z" fill="#3b4757"/><rect x="104" y="96" width="672" height="8" fill="#2c3644"/>
<rect x="300" y="112" width="280" height="40" rx="5" fill="#2b3442"/>
<use href="#finch" transform="translate(316 120) scale(0.9)"/>
<text x="356" y="138" font-family="system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="1.5" fill="#f7f8fa">PELLOW &amp; FINCH</text>
<text x="440" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#5d6876">LOGISTICS · DEPOT 3</text>
<g><rect x="150" y="186" width="96" height="70" fill="url(#door)"/><rect x="266" y="186" width="96" height="70" fill="#2c3340"/><rect x="518" y="186" width="96" height="70" fill="url(#door)"/><rect x="634" y="186" width="96" height="70" fill="url(#door)"/>
  <rect x="382" y="196" width="40" height="60" fill="#8e9aab"/><rect x="408" y="224" width="4" height="10" fill="#2c3644"/><rect x="440" y="200" width="56" height="26" fill="#9fc6dd" stroke="#8e9aab" stroke-width="3"/>
  <text x="198" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#5d6876">BAY 1</text><text x="314" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#5d6876">BAY 2</text>
  <text x="566" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#5d6876">BAY 3</text><text x="682" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#5d6876">BAY 4</text></g>
<use href="#box" transform="translate(276 228)"/><use href="#box" transform="translate(314 228)"/><use href="#box" transform="translate(295 202)"/>
<!-- CCTV on the corner: someone is watching -->
<g transform="translate(748 118)"><rect x="-2" y="0" width="6" height="16" fill="#2c3644"/><path d="M-30 14 L4 8 L6 22 L-28 28 Z" fill="#f7f8fa" stroke="#2c3644" stroke-width="2"/><circle cx="-28" cy="21" r="4" fill="#2c3644"/><circle cx="-6" cy="14" r="2.5" fill="#e2733a"/></g>
<!-- the yard: parcels and vans -->
<use href="#box" transform="translate(790 222)"/><use href="#box" transform="translate(826 222)"/><use href="#box" transform="translate(808 196)"/><use href="#box" transform="translate(862 222)"/>
<use href="#van" transform="translate(126 214) scale(0.66)"/>
<use href="#van" transform="translate(930 168) scale(0.8)"/>
<rect x="1150" y="150" width="8" height="110" fill="#8e9aab"/><rect x="1110" y="140" width="88" height="34" rx="4" fill="#2b3442"/><text x="1154" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#f2c94c">GOODS IN</text>
</svg>
