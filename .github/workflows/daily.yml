# Rebuilds Patch Notes every morning and publishes it to GitHub Pages.
# Setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Optional: add an NVD_API_KEY repository secret for faster CVE fetching.
name: Daily build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:       # "Run workflow" button for manual rebuilds
  push:
    branches: [main]

# Least privilege: nothing by default. The build job (which reads untrusted feeds and holds the NVD key) can only
# read the repo; only the deploy job can publish to Pages. Third-party actions are pinned to exact commits
# (Dependabot keeps the pins up to date) so a moved tag can't change what runs here.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Keep the CVE database between runs so the site can show what's new (one cache entry per day).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cves.db
          key: cves-db-${{ steps.day.outputs.day }}
          restore-keys: cves-db-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # A failing test stops the deploy, so a bad change never reaches the live site.
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/page.test.mjs tests/missions.test.mjs tests/layout.test.mjs tests/labs.test.mjs tests/flow.test.mjs tests/exam.test.mjs tests/concept.test.mjs tests/agency.test.mjs tests/vlan.test.mjs tests/hashing.test.mjs tests/netmodel.test.mjs tests/netbuilder.test.mjs
      - name: Build site
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # On failure, the last lines also go into an annotation, readable through the API without the full log.
        run: |
          set -o pipefail
          python build.py --days 7 2>&1 | tee build.log || {
            echo "::error title=Build site failed::$(tail -n 25 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
