# Rebuilds Patch Notes every morning and publishes it to GitHub Pages.
# Setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Optional: add an NVD_API_KEY repository secret for faster CVE fetching.
name: Daily build

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:       # "Run workflow" button for manual rebuilds
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Keep the CVE database between runs so the site can show what's new (one cache entry per day).
      - uses: actions/cache@v4
        with:
          path: cves.db
          key: cves-db-${{ steps.day.outputs.day }}
          restore-keys: cves-db-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A failing test stops the deploy, so a bad change never reaches the live site.
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/page.test.mjs tests/missions.test.mjs
      - name: Build site
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python build.py --days 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
